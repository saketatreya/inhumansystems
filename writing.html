<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INHUMAN SYSTEMS</title>

    <!-- KaTeX for math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$',  right: '$',  display: false}
            ],
            throwOnError: false
        });"></script>

    <style>
        body {
            background-color: #000;
            background-image: linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111), 
                              linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #ddd;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 10px;
            cursor: none; 
        }

        a, button, input { cursor: none; }

        #rat-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            width: 80px; 
            height: 80px;
            transform: translate(-50%, -50%);
        }

        @keyframes rat-color {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .page-block {
            background: #000;
            border: 3px outset #555;
            margin: 15px auto;
            max-width: 900px;
            padding: 15px;
            box-shadow: 5px 5px 0px #222;
        }

        .header-block {
            text-align: center;
            border-bottom: 2px dashed #ff4d4d;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header-block h1 {
            color: #fff;
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px #ff4d4d;
        }

        nav {
            text-align: center;
            background: #1a1a1a;
            border: 2px inset #444;
            padding: 5px;
            margin-bottom: 20px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
        }

        nav a:hover {
            color: #ff4d4d;
        }

        /* Article styles */
        .article-title {
            color: #fff;
            margin-bottom: 0.3em;
            font-size: 2rem;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .article-meta {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 2em;
            border-bottom: 2px dashed #444;
            padding-bottom: 10px;
        }

        .article-meta .tags {
            color: #ffcc00;
            font-size: 0.8rem;
            display: block;
            margin-top: 5px;
        }

        .prose {
            line-height: 1.8;
            font-size: 1.15rem;
        }

        .prose h2 {
            margin-top: 1.5em;
            border-bottom: 1px solid #333;
            padding-bottom: 0.3em;
            font-size: 1.5rem;
            color: #fff;
        }

        .prose h3 {
            margin-top: 1.2em;
            font-size: 1.2rem;
            color: #ddd;
        }

        .prose strong { color: #fff; }
        .prose em { color: #ccc; }

        .prose a {
            color: #66b5ff;
            text-decoration: none;
            border-bottom: 1px dotted #66b5ff;
        }

        .prose a:hover {
            color: #ff4d4d;
            border-bottom: 1px solid #ff4d4d;
            background: #111;
        }

        .prose blockquote {
            border-left: 4px solid #ff4d4d;
            padding-left: 15px;
            margin: 1.5em 0;
            color: #aaa;
            background: #111;
            padding: 10px 15px;
            font-style: italic;
        }

        .prose code {
            background: #1a1a1a;
            padding: 2px 5px;
            font-size: 0.9em;
            color: #66b5ff;
            border: 1px solid #333;
        }

        .prose pre {
            background: #111;
            border: 2px inset #444;
            padding: 1em;
            overflow-x: auto;
            line-height: 1.5;
        }

        .prose pre code {
            background: none;
            padding: 0;
            color: #aaa;
            border: none;
        }

        .prose ul, .prose ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        .prose hr {
            border: none;
            border-top: 2px dashed #444;
            margin: 2em 0;
        }

        .prose img {
            max-width: 100%;
            height: auto;
            border: 2px outset #555;
            display: block;
            margin: 1em auto;
        }

        /* Tables */
        .prose table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            background: #0a0a0a;
        }

        .prose th {
            text-align: left;
            padding: 8px;
            border-bottom: 2px solid #555;
            color: #ff4d4d;
            background: #111;
        }

        .prose td {
            padding: 8px;
            border-bottom: 1px solid #222;
        }

        .prose tr:hover td {
            background: #111;
        }

        /* Math overrides */
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 10px;
            background: #0a0a0a;
            border: 1px dashed #333;
            margin: 1.5em 0 !important;
        }

        /* Progress Bar */
        .progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: #ff4d4d;
            z-index: 20;
            width: 0;
            transition: width 0.05s linear;
        }

        .loading {
            color: #ffcc00;
            font-size: 1.2rem;
            text-align: center;
            padding: 5em 0;
            font-weight: bold;
        }

        .article-footer {
            text-align: center;
            margin-top: 3em;
            padding-top: 1em;
            border-top: 2px solid #333;
        }

        .article-footer a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 15px;
            border: 2px outset #555;
            background: #222;
        }
        
        .article-footer a:hover {
            border-style: inset;
            color: #ff4d4d;
        }

        /* TOC Styles */
        .toc-container {
            background: #111;
            border: 2px inset #444;
            padding: 10px;
            margin-bottom: 2em;
        }

        @media (min-width: 1300px) {
            .toc-container {
                position: fixed;
                top: 50px;
                right: 20px;
                width: 250px;
                max-height: calc(100vh - 100px);
                overflow-y: auto;
                z-index: 100;
                margin-bottom: 0;
            }
            .toc-container::-webkit-scrollbar { width: 8px; }
            .toc-container::-webkit-scrollbar-track { background: #000; border-left: 1px solid #444; }
            .toc-container::-webkit-scrollbar-thumb { background: #555; border: 1px outset #888; }
        }

        .toc-header {
            color: #ff4d4d;
            font-weight: bold;
            border-bottom: 1px dashed #444;
            margin-bottom: 8px;
            padding-bottom: 4px;
        }

        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.95rem;
        }

        .toc-list li {
            margin-bottom: 4px;
        }

        .toc-list li.toc-h3 {
            padding-left: 15px;
        }

        .toc-list a {
            color: #66b5ff;
            text-decoration: none;
        }

        .toc-list a:hover {
            color: #fff;
            background: #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="progress" id="progress"></div>

    <!-- The custom cursor image -->
    <img id="rat-cursor" src="writings/rat__3.gif" alt="spinning rat">

    <div class="page-block">
        <div class="header-block">
            <h1>INHUMAN SYSTEMS</h1>
            <div style="color: #888; font-size: 0.9rem;">READING TRANSMISSION</div>
        </div>

        <nav>
            <a href="index.html">[ ← Return Home ]</a>
        </nav>

        <div id="article">
            <p class="loading" id="loading">DECRYPTING...</p>
        </div>
    </div>

    <!-- marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>

    <script>
        // Custom Cursor Logic
        const rat = document.getElementById('rat-cursor');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        
        rat.style.left = mouseX + 'px';
        rat.style.top = mouseY + 'px';

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            rat.style.left = mouseX + 'px';
            rat.style.top = mouseY + 'px';
        });

        document.addEventListener('mouseout', () => rat.style.display = 'none');
        document.addEventListener('mouseover', () => rat.style.display = 'block');

        // Reading Progress
        const bar = document.getElementById('progress');
        window.addEventListener('scroll', () => {
            const h = document.documentElement.scrollHeight - window.innerHeight;
            const pct = h > 0 ? (window.scrollY / h) * 100 : 0;
            bar.style.width = pct + '%';
        });

        // Article Fetching & Rendering
        const params = new URLSearchParams(window.location.search);
        const file = params.get('f');

        if (!file) {
            window.location.href = 'index.html';
        }

        function parseFrontmatter(raw) {
            const match = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
            if (!match) return { meta: {}, body: raw };
            const meta = {};
            match[1].split('\n').forEach(line => {
                const m = line.match(/^(\w+):\s*(.+)$/);
                if (m) {
                    let val = m[2].trim();
                    if (val.startsWith('[') && val.endsWith(']')) {
                        val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
                    }
                    if (typeof val === 'string') {
                        val = val.replace(/^["']|["']$/g, '');
                    }
                    meta[m[1]] = val;
                }
            });
            return { meta, body: match[2] };
        }

        function escapeMath(src) {
            const blocks = [];
            src = src.replace(/\$\$([\s\S]*?)\$\$/g, (_, inner) => {
                const id = blocks.length;
                blocks.push({ display: true, inner });
                return `\x00MATH${id}\x00`;
            });
            src = src.replace(/\$([^\n$\`]+?)\$/g, (_, inner) => {
                const id = blocks.length;
                blocks.push({ display: false, inner });
                return `\x00MATH${id}\x00`;
            });
            return { escaped: src, blocks };
        }

        function restoreMath(html, blocks) {
            return html.replace(/\x00MATH(\d+)\x00/g, (_, id) => {
                const { display, inner } = blocks[+id];
                return display ? `$$${inner}$$` : `$${inner}$`;
            });
        }

        marked.setOptions({ breaks: false, gfm: true, smartypants: false });

        fetch('writings/' + file)
            .then(r => {
                if (!r.ok) throw new Error('not found');
                return r.text();
            })
            .then(raw => {
                const { meta, body } = parseFrontmatter(raw);
                const readingTime = Math.max(1, Math.round(body.split(/\s+/).length / 200));
                const { escaped, blocks } = escapeMath(body);
                const rawHtml = marked.parse(escaped);
                const html = restoreMath(rawHtml, blocks);

                document.title = (meta.title || file) + ' — INHUMAN SYSTEMS';

                const article = document.getElementById('article');
                const tags = Array.isArray(meta.tags) ? meta.tags : [];
                const tagsStr = tags.join(', ');

                article.innerHTML = `
                    <h1 class="article-title">${meta.title || file}</h1>
                    <div class="article-meta">
                        ${meta.date || 'UNKNOWN DATE'} // EST. READ: ${readingTime} MIN
                        ${tags.length > 0 ? '<span class="tags">TAGS: ' + tagsStr + '</span>' : ''}
                    </div>
                    <div id="toc-container" class="toc-container" style="display:none;">
                        <div class="toc-header">INDEX</div>
                        <ul id="toc-list" class="toc-list"></ul>
                    </div>
                    <div class="prose">${html}</div>
                    <div class="article-footer">
                        <a href="index.html">RETURN TO INDEX</a>
                    </div>
                `;

                // Generate Table of Contents
                const prose = article.querySelector('.prose');
                const headings = prose.querySelectorAll('h2, h3');
                if (headings.length > 0) {
                    const tocContainer = article.querySelector('#toc-container');
                    const tocList = article.querySelector('#toc-list');
                    tocContainer.style.display = 'block';
                    
                    headings.forEach((h, i) => {
                        const id = h.id || 'heading-' + i;
                        h.id = id; // Ensure heading has an ID
                        
                        const li = document.createElement('li');
                        li.className = 'toc-' + h.tagName.toLowerCase();
                        
                        const a = document.createElement('a');
                        a.href = '#' + id;
                        a.textContent = h.textContent;
                        
                        li.appendChild(a);
                        tocList.appendChild(li);
                    });
                }

                if (window.renderMathInElement) {
                    renderMathInElement(article, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            })
            .catch(() => {
                document.getElementById('article').innerHTML = '<p class="loading">404: TRANSMISSION NOT FOUND</p>';
            });
    </script>
</body>
</html>
